{% extends "base.html" %}
{% block title %}Error {{ code }} - SecureStego{% endblock %}
{% block content %}
<div class="card mt-2 text-center" style="max-width:500px; margin:3rem auto;">
  <div class="stat-value" style="color:var(--danger); font-size:3rem;">{{ code }}</div>
  <p>{{ message }}</p>
  <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">Return Home</a>
</div>
{% endblock %}
