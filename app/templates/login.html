{% extends "base.html" %}
{% block title %}Login - SecureStego{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="card">
    <div class="section-title"><span class="tag">AUTH</span></div>
    <h2>Login</h2>
    <p class="text-dim">Access your dashboard, embed and extraction history.</p>

    <form method="POST" action="{{ url_for('auth.login') }}" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label for="username">Username or email</label>
        <input type="text" id="username" name="username" required autofocus>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Login</button>
    </form>
    <p class="text-center mt-1 text-dim">No account yet? <a href="{{ url_for('auth.register') }}">Register</a></p>
  </div>
</div>
{% endblock %}
